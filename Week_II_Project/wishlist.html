<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Streetwear E-Commerce | Wishlist Favorites</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/wishlist.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <header id="header">
        <a href="index.html" class="logo">Apex<span>Streetwear</span></a>
        <nav>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a class="active" href="wishlist.html">Wishlist</a></li>
                <li><a href="login.html">Login</a></li>
                
                <li id="user-profile-status" class="user-status-item">
                    <i class="fa-regular fa-user"></i> <span id="profile-display-text">Guest</span>
                </li>
                
                <li><a href="checkout.html" id="lg-bag"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count">0</span></a></li>
                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
            </ul>
        </nav>
        <div id="mobile">
            <a href="checkout.html"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count">0</span></a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </header>

    <section id="wishlist-header" class="section-p1">
        <h2>My Wishlist Management</h2>
        <p>Save your preferred products featured on your interest</p>
    </section>

    <section id="wishlist-items" class="section-p1">
        <div class="wishlist-container" id="wishlist-grid"></div>
    </section>

    <footer class="section-p1">
        <div class="copyright">
            <p>© 2026, Anuj Malpani - Founder ApexStreetwear</p>
        </div>
    </footer>

    <script src="js/catalog.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/cart.js"></script>

</html>
