<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Streetwear E-Commerce | Shop Catalog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <header id="header">
        <a href="index.html" class="logo">Apex<span>Streetwear</span></a>
        <nav>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="shop.html">Shop</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="login.html">Login</a></li>
                
                <li id="user-profile-status" class="user-status-item">
                    <i class="fa-regular fa-user"></i> <span id="profile-display-text">Guest</span>
                </li>
                
                <li><a href="checkout.html" id="lg-bag"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count">0</span></a></li>
                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
            </ul>
        </nav>
        <div id="mobile">
            <a href="checkout.html"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count">0</span></a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </header>

    <section id="page-header">
        <h2>#stayhome deals</h2>
        <p>Save more with coupons & up to 70% off!</p>
    </section>

    <section id="shop-search-section" class="section-p1">
        <div class="search-sort-wrapper">
            <input type="text" id="product-search" placeholder="Search product catalogs...">
            <select id="price-sort">
                <option value="default">Default Sorting</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
            </select>
        </div>
    </section>

    <section id="product1" class="section-p1">
        <div class="pro-container" id="shop-catalog-container"></div>
    </section>

    <footer class="section-p1">
        <div class="copyright">
            <p>© 2026, Anuj Malpani - Founder ApexStreetwear</p>
        </div>
    </footer>

    <script src="js/catalog.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
